<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="cardBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#121218" />
      <stop offset="60%" stop-color="#08080c" />
      <stop offset="100%" stop-color="#020204" />
    </radialGradient>

    <!-- Neon Crimson Rim Edge Glow -->
    <linearGradient id="rimGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1e27" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#e50914" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#ff1e27" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#b00008" stop-opacity="0.1" />
    </linearGradient>

    <!-- White Metallic Gradient for E -->
    <linearGradient id="eWhiteGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f5f6fa" />
      <stop offset="100%" stop-color="#dcdde3" />
    </linearGradient>

    <!-- Crimson Play Gradient -->
    <linearGradient id="playRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3848" />
      <stop offset="45%" stop-color="#e50914" />
      <stop offset="100%" stop-color="#990008" />
    </linearGradient>

    <!-- Subtle Drop Shadow for Logo Mark -->
    <filter id="markShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- Outer Rim Glow Filter -->
    <filter id="outerNeon" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Black Squircle Tile -->
  <rect width="512" height="512" rx="112" fill="url(#cardBg)" />

  <!-- Perimeter Ambient Neon Rim (Glowing Edges) -->
  <rect x="4" y="4" width="504" height="504" rx="109" fill="none" stroke="url(#rimGlow)" stroke-width="4.5" />
  <rect x="8" y="8" width="496" height="496" rx="106" fill="none" stroke="rgba(255, 30, 39, 0.2)" stroke-width="1.5" />

  <!-- Logo Mark Group -->
  <g filter="url(#markShadow)">
    
    <!-- Bold Slanted 'E' -->
    <path d="
      M 198 128
      L 318 128
      C 321 128, 323 131, 322 134
      L 302 168
      C 300 171, 297 173, 294 173
      L 204 173
      C 197 173, 192 178, 191 185
      L 182 227
      L 272 227
      C 275 227, 277 230, 276 233
      L 258 265
      C 256 268, 253 270, 250 270
      L 173 270
      C 166 270, 161 275, 160 282
      L 149 329
      L 298 329
      C 301 329, 303 332, 302 335
      L 282 368
      C 280 371, 277 373, 274 373
      L 132 373
      C 114 373, 102 355, 106 337
      L 142 162
      C 146 142, 163 128, 184 128
      Z
    " fill="url(#eWhiteGrad)" />

    <!-- Red Play Camera Symbol -->
    <!-- Play Triangle pointing right -->
    <path d="
      M 298 178
      C 298 170, 307 165, 314 169
      L 388 214
      C 395 218, 395 229, 388 233
      L 314 278
      C 307 282, 298 277, 298 269
      Z
    " fill="url(#playRedGrad)" />

    <!-- Camera Reel / Back Wing Triangle -->
    <path d="
      M 416 169
      C 416 162, 407 158, 402 163
      L 358 206
      C 353 211, 353 219, 358 224
      L 402 267
      C 407 272, 416 268, 416 261
      Z
    " fill="url(#playRedGrad)" opacity="0.92" />
  </g>

  <!-- Brand Wordmark: EPIC OTT -->
  <g id="epicOttWordmark">
    <!-- EPIC in Pure White -->
    <text x="216" y="442" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="4" text-anchor="end">EPIC</text>
    
    <!-- OTT in Neon Crimson Red -->
    <text x="238" y="442" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#e50914" letter-spacing="4" text-anchor="start">OTT</text>
  </g>
</svg>
