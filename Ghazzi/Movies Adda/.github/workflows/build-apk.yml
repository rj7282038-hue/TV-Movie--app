name: Build Movies_Adda APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Sync Web Assets to Android App
        run: |
          mkdir -p android-app/app/src/main/assets/www
          if [ -f "index.html" ]; then
            echo "Syncing index.html to android-app assets..."
            cp -vf index.html android-app/app/src/main/assets/www/index.html
          fi
          if [ -f "player.html" ]; then
            echo "Syncing player.html to android-app assets..."
            cp -vf player.html android-app/app/src/main/assets/www/player.html
          fi
          if [ -f "manifest.json" ]; then
            echo "Syncing manifest.json to android-app assets..."
            cp -vf manifest.json android-app/app/src/main/assets/www/manifest.json
          fi

      - name: Build Debug APK
        run: |
          if [ -d "android-app" ]; then
            echo "Entering android-app directory..."
            cd android-app
          fi
          gradle assembleDebug --stacktrace

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Movies_Adda-Debug-APK
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
